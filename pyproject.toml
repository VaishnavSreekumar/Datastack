[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datastack"
version = "0.1.0"
description = "Production-style Olist E-commerce Data Engineering Platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Vaishnav Sreekumar", email = "vaishnavsreekumar301@gmail.com"}
]
dependencies = [
    "pyspark>=3.5.0,<3.6.0",
    "pyarrow>=14.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "duckdb>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "SQLAlchemy>=2.0.0",
    "dbt-core>=1.8.0",
    "dbt-postgres>=1.8.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "tabulate>=0.9.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
